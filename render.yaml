services:
  - type: web
    name: telegram-direct-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start:telegram-direct
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_DIRECT_SESSION_KEY
        sync: false
      - key: TELEGRAM_DIRECT_SERVICE_SECRET
        sync: false
