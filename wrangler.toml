name = "findmaid"
main = "functions/api/[[...path]].ts"
compatibility_date = "2024-10-01"

[assets]
directory = "./frontend/dist"
binding = "ASSETS"

[[kv_namespaces]]
binding = "APP_DATA"
id = "62a5ada5801547b5b0895fec94ab0b12"
preview_id = "595830971f4f4125975ddcdeb627de67"

[vars]
# Storage: "kv" uses the APP_DATA KV namespace above. Remove to fall back to Supabase.
STORAGE_BACKEND = "supabase"

# RECOMMENDED FOR PRODUCTION: collapse agency-admin auth to a single normalized
# table (helped_agency_admins) so the login store cannot drift from main data —
# the root cause of the recurring "Invalid username or password" 401s.
#
# ORDER MATTERS — enabling this before migrating locks every admin out (normalized
# mode reads the table directly; an empty table means no admins can log in):
#   1. Apply supabase/normalized_project_setup.sql to the prod Supabase project.
#   2. Run the one-time migration RPC (populates the normalized tables from the
#      existing app_data blob):
#        select public.migrate_helped_blob_to_normalized('<app_id>');
#   3. THEN uncomment the line below and deploy.
# (loadAgencyAdminAuthData now falls back to main data if the table is empty, but
#  treat that as a seatbelt, not the plan — migrate first.)
# SUPABASE_USE_NORMALIZED = "true"

# Supabase — kept for client OAuth/phone JWT verification and AI conversation logs only.
# Not used for app data when STORAGE_BACKEND=kv.
SUPABASE_URL = "https://etdbexgrsenjznxbbnbd.supabase.co"
SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV0ZGJleGdyc2VuanpueGJibmJkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxMjY3MjAsImV4cCI6MjA5MDcwMjcyMH0.vtop8R2up7ItNoGXoU1Bx1VAVq23gimj-21nBX4LAg4"

AI_AUTOPILOT_ENABLED = "true"

# Claude model for AI Marketing copy (and other Anthropic calls that read it).
# Defaults to claude-haiku-4-5 in code when unset — cheap/fast, suited to short
# WhatsApp/email blurbs. Bump to claude-sonnet-5 or claude-opus-4-8 for higher
# writing quality. The ANTHROPIC_API_KEY itself is a secret: npx wrangler secret put ANTHROPIC_API_KEY
ANTHROPIC_MODEL = "claude-haiku-4-5"

# OpenAI-compatible API — used by PDF autofill when set.
# OPENAI_API_KEY should be set via: npx wrangler secret put OPENAI_API_KEY
# Change OPENAI_BASE_URL to use a different provider:
#   OpenAI:     https://api.openai.com/v1
#   OpenRouter: https://openrouter.ai/api/v1
#   Groq:       https://api.groq.com/openai/v1
# Cline AI (Kimi K2.6 Code — primary AI for screening, HR interviews, etc.)
CLINE_API_URL = "https://api.cline.bot/api/v1"
CLINE_MODEL = "openai/gpt-4o-mini"
# CLINE_API_KEY must be set as a secret: npx wrangler secret put CLINE_API_KEY

# Fallback: OpenAI-compatible API
OPENAI_BASE_URL = "https://api.cline.bot/api/v1"
OPENAI_MODEL = "openai/gpt-4o-mini"

# Email confirmations — requires Resend account + verified domain.
# Steps: 1) Sign up at resend.com  2) Verify your domain  3) Run:
#   npx wrangler secret put RESEND_API_KEY
# Then update RESEND_FROM below with your verified domain.
# Without RESEND_API_KEY, email features (client registration confirmation) return 503 gracefully.
RESEND_FROM = "Find Maid <no-reply@rinzinagency.com>"
DEV_EXPOSE_CONFIRMATION_CODE = "false"

# TikTok Developer App credentials (for Login Kit OAuth).
# Set via: npx wrangler secret put TIKTOK_CLIENT_KEY
# Set via: npx wrangler secret put TIKTOK_CLIENT_SECRET
# TIKTOK_CLIENT_KEY = ""
# TIKTOK_CLIENT_SECRET = ""

[observability.logs]
enabled = false
invocation_logs = true

[ai]
binding = "AI"

[triggers]
crons = ["*/30 * * * *"]
